    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
