services:
  # Redis for rate limiting
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # MongoDB for Kainera Project
  mongodb:
    image: mongo:5.0
    container_name: kainella-mongodb
    ports:
      - "27028:27028" # Different port to avoid conflict with Nicee project
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command:
      - mongod
      - "--port"
      - "27028"
      - "--bind_ip_all"
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--port",
          "27028",
          "--eval",
          "db.adminCommand('ping')",
          "--quiet",
        ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # RabbitMQ (now properly at root level)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disable security for development
      - ES_JAVA_OPTS=-Xms1g -Xmx1g # Set heap size
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health && curl -f http://localhost:9200/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Kaynela Farms Payment Service
  kainella-payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    volumes:
      - ./services/payment-service:/app
      - /app/node_modules
      - ./logs/payment-service:/app/logs
      - ./shared:/app/shared:ro
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: "kainella-payment-service"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27028/kainella-payments?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_BUSINESS_SHORT_CODE: ${MPESA_BUSINESS_SHORT_CODE}
      MPESA_WEBHOOK_SECRET: ${MPESA_WEBHOOK_SECRET}
      AIRTEL_MONEY_CLIENT_ID: ${AIRTEL_MONEY_CLIENT_ID}
      AIRTEL_MONEY_CLIENT_SECRET: ${AIRTEL_MONEY_CLIENT_SECRET}
      AIRTEL_MONEY_WEBHOOK_SECRET: ${AIRTEL_MONEY_WEBHOOK_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Kaynela Farms Notification Service
  kainella-notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
      - ./logs/notification-service:/app/logs
      - ./shared:/app/shared:ro
    ports:
      - "3006:3006"
    environment:
      SERVICE_NAME: "kainella-notification-service"
      NODE_ENV: development
      PORT: 3006
      SESSION_SECRET: ${SESSION_SECRET}
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27028/kainella-notifications?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3006/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/cors_preflight.conf:/etc/nginx/cors_preflight.conf:ro
      - gateway_logs:/var/log/nginx
    environment:
      - NGINX_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # depends_on:
    #   kainella-auth-service:
    #     condition: service_healthy
    #   kainella-booking-service:
    #     condition: service_healthy
    #   kainella-payment-service:
    #     condition: service_healthy
    #   kainella-notification-service:
    #     condition: service_healthy
    #   kainella-loyalty-service:
    #     condition: service_healthy
    #   kainella-ticketing-service:
    #     condition: service_healthy
    #   kainella-reporting-service:
    #     condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Kaynela Farms Auth Service
  kainella-auth-service:
    build:
      context: ./services/kanyeraAuth-service
      dockerfile: Dockerfile
    volumes:
      - ./services/kanyeraAuth-service:/app
      - /app/node_modules
      - ./logs/auth-service:/app/logs
      - ./shared:/app/shared:ro
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: "kainella-auth-service"
      NODE_ENV: development
      SESSION_SECRET: ${SESSION_SECRET}
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27028/kainella-auth?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      FRONTEND_URL: ${FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

