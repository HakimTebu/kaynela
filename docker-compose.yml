      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      FRONTEND_URL: ${FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Kaynela Farms Loyalty Service
  kainella-loyalty-service:
    build:
      context: ./services/loyalty-service
      dockerfile: Dockerfile
    volumes:
      - ./services/loyalty-service:/app
      - /app/node_modules
      - ./logs/loyalty-service:/app/logs
