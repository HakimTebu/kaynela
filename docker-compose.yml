      context: ./services/reporting-service
      dockerfile: Dockerfile
    volumes:
      - ./services/reporting-service:/app
      - /app/node_modules
      - ./logs/reporting-service:/app/logs
      - ./shared:/app/shared:ro
    ports:
      - "3007:3007"
    environment:
      SERVICE_NAME: "kainella-reporting-service"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27028/kainella-reporting?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      FRONTEND_URL: ${FRONTEND_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3007/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
