    environment:
      SERVICE_NAME: "kainella-loyalty-service"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27028/kainella-loyalty?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      FRONTEND_URL: ${FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Kaynela Farms Ticketing Service
  kainella-ticketing-service:
    build:
      context: ./services/ticketing-service
      dockerfile: Dockerfile
    volumes:
      - ./services/ticketing-service:/app
      - /app/node_modules
