    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  mongodb_data:
  rabbitmq_data:
  elasticsearch_data:
  gateway_logs:

networks:
  backend:
    driver: bridge
