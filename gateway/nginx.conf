# Netflix-Level Production Nginx Configuration
# Optimized for Kaynella Farms microservices architecture with security, performance, and monitoring

# Worker processes - auto-detection for optimal performance
worker_processes auto;
worker_cpu_affinity auto;

# Error logging with structured format
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events configuration for high concurrency
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off; 
}

# HTTP configuration
http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format for structured logging (Netflix style)
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time" '
                        'upstream="$upstream_addr" upstream_status="$upstream_status" '
                        'request_id="$http_x_request_id" service="$http_x_service_name"';

    access_log /var/log/nginx/access.log main_ext;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Buffer sizes for large requests
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=ticketing:10m rate=8r/s;
    limit_req_zone $binary_remote_addr zone=booking:10m rate=6r/s;
    limit_req_zone $binary_remote_addr zone=reporting:10m rate=4r/s;

    # Upstream services with health checks and load balancing
    upstream auth_service {
        least_conn;
        server kainella-auth-service:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream booking_service {
        least_conn;
        server kainella-booking-service:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment_service {
        least_conn;
        server kainella-payment-service:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream loyalty_service {
        least_conn;
        server kainella-loyalty-service:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ticketing_service {
        least_conn;
        server kainella-ticketing-service:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_service {
        least_conn;
        server kainella-notification-service:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream reporting_service {
        least_conn;
        server kainella-reporting-service:3007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server block
    server {
        listen 8080;
        server_name _;

        # Security headers (Netflix security standards)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Remove server signature
        server_tokens off;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"OK","gateway":"operational","timestamp":"$time_iso8601","uptime":"$upstream_response_time"}';
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Metrics endpoint for monitoring
        location /metrics {
            access_log off;
            stub_status on;
            add_header Content-Type text/plain;
        }

        # Auth service routes (rate limited)
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "auth";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Booking service routes
        location /api/bookings {
            limit_req zone=booking burst=20 nodelay;
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "booking";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Payment service routes (strict rate limiting)
        location /api/payments {
            limit_req zone=payment burst=5 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "payment";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Loyalty service routes
        location /api/loyalty {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://loyalty_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "loyalty";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Ticketing service routes
        location /api/ticketing {
            limit_req zone=ticketing burst=25 nodelay;
            proxy_pass http://ticketing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "ticketing";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Events routes (part of ticketing service)
        location /api/events {
            limit_req zone=ticketing burst=25 nodelay;
            proxy_pass http://ticketing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "ticketing-events";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # QR Code routes (part of ticketing service)
        location /api/qr-codes {
            limit_req zone=ticketing burst=30 nodelay;
            proxy_pass http://ticketing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "ticketing-qr";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Ticket validation routes (part of ticketing service)
        location /api/validation {
            limit_req zone=ticketing burst=40 nodelay;
            proxy_pass http://ticketing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "ticketing-validation";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Notification service routes
        location /api/notifications {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "notification";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s; 
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Reporting service routes (rate limited for performance)
        location /api/reporting {
            limit_req zone=reporting burst=15 nodelay;
            proxy_pass http://reporting_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "reporting";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Analytics routes (part of reporting service)
        location /api/analytics {
            limit_req zone=reporting burst=15 nodelay;
            proxy_pass http://reporting_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Service-Name "reporting-analytics";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            include /etc/nginx/cors_preflight.conf;
        }

        # Error pages
        error_page 404 /404.json;
        error_page 500 502 503 504 /50x.json;

        location = /404.json {
            internal;
            return 404 '{"error":"Not Found","message":"Route not recognized","timestamp":"$time_iso8601","request_id":"$request_id"}';
            add_header Content-Type application/json;
        }

        location = /50x.json {
            internal;
            return 500 '{"error":"Internal Server Error","message":"Service temporarily unavailable","timestamp":"$time_iso8601","request_id":"$request_id"}';
            add_header Content-Type application/json;
        }

        # Default catch-all
        location / {
            return 404 '{"error":"Not Found","message":"Route not recognized","timestamp":"$time_iso8601","request_id":"$request_id"}';
            add_header Content-Type application/json;
        }
    }
}

