# Netflix-Level CORS Configuration
# Secure, production-ready CORS handling

# Handle preflight requests
if ($request_method = "OPTIONS") {
    # Security-focused CORS headers
    add_header "Access-Control-Allow-Origin" "$http_origin" always;
    add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-Service-Name, Accept, Origin, Cache-Control, X-File-Name" always;
    add_header "Access-Control-Allow-Credentials" "true" always;
    add_header "Access-Control-Max-Age" "1728000" always;
    add_header "Access-Control-Expose-Headers" "X-Request-ID, X-Service-Name" always;
    
    # Security headers for preflight
    add_header "X-Content-Type-Options" "nosniff" always;
    add_header "X-Frame-Options" "SAMEORIGIN" always;
    add_header "X-XSS-Protection" "1; mode=block" always;
    
    # Return 204 for preflight
    add_header "Content-Type" "text/plain; charset=utf-8" always;
    add_header "Content-Length" "0" always;
    return 204;
}

# Add CORS headers for actual requests
add_header "Access-Control-Allow-Origin" "$http_origin" always;
add_header "Access-Control-Allow-Credentials" "true" always;
add_header "Access-Control-Expose-Headers" "X-Request-ID, X-Service-Name" always;

# Additional debugging headers
add_header "X-Debug-Origin" "$http_origin" always;
add_header "X-Debug-Host" "$host" always;
 