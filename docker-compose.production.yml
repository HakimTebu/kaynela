      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/rewards-service?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      RABBITMQ_HEARTBEAT: "60"
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
