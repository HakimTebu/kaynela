      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/restaurant-service?authSource=admin&connectTimeoutMS=10000
      BASE_URL: ${BASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672?heartbeat=60
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HEARTBEAT: "60"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_PROFILE_SERVICE_URL: http://user-profile-service:3002
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
