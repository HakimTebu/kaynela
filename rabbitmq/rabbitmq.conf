# RabbitMQ Enterprise Configuration for Kainella Farms
# Optimized for high throughput and reliability

## Networking
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

## Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@kainella-rabbitmq

## Memory and Disk
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5
disk_free_limit.relative = 2.0

## Logging
log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.size = 0

## Security
default_user = ${RABBITMQ_USER}
default_pass = ${RABBITMQ_PASSWORD}
default_vhost = /
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

## Performance
heartbeat = 60
frame_max = 131072
channel_max = 2047
connection_max = 1000

## Queue and Exchange
queue_master_locator = min-masters
default_queue_type = quorum
quorum_initial_group_size = 3

## Management
management.load_definitions = /etc/rabbitmq/definitions.json
management.http_log_dir = /var/log/rabbitmq/access.log

## Resource limits
num_acceptors.tcp = 10
handshake_timeout = 10000

## Memory management
vm_memory_calculation_strategy = rss
vm_memory_high_watermark.absolute = 1GB

## Disk management
disk_free_limit.absolute = 2GB

## Network partitions
cluster_partition_handling = pause_minority

## Message TTL
default_ttl = 0
default_ttl_max = 86400000

## Consumer timeout
consumer_timeout = 300000

## Queue limits
default_queue_type = quorum
quorum_initial_group_size = 3
