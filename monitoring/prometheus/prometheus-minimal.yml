global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dunkin-cluster
    environment: production

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter - System metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter-monitoring:9100"]

  # Blackbox monitoring for HTTP endpoints
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus-monitoring:9090
          - http://grafana-monitoring:3000
          - http://elasticsearch-monitoring:9200
          - http://kibana-monitoring:5601
          - http://jaeger-monitoring:16686
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
