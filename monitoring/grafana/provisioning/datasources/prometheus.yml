# Grafana Datasource Configuration for Kainella Farms
# Prometheus datasource setup

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
    version: 1

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "kainella-logs"
    jsonData:
      index: "kainella-logs"
      timeField: "@timestamp"
      esVersion: "8.0.0"
      interval: "Daily"
      timeInterval: "1m"
    version: 1
