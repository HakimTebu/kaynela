# Fluentd Configuration for Kainella Farms
# Enterprise log aggregation setup

<source>
  @type tail
  @id kainella-logs
  path /var/log/app/**/*.log
  pos_file /var/log/fluentd/kainella.log.pos
  tag kainella.*
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
</source>

<source>
  @type tail
  @id nginx-logs
  path /var/log/nginx/*.log
  pos_file /var/log/fluentd/nginx.log.pos
  tag nginx.*
  format nginx
</source>

<filter kainella.**>
  @type record_transformer
  <record>
    service_name ${tag_parts[1]}
    environment production
    cluster kainella-farms
  </record>
</filter>

<filter nginx.**>
  @type record_transformer
  <record>
    service_name nginx
    environment production
    cluster kainella-farms
  </record>
</filter>

<match kainella.**>
  @type elasticsearch
  @id kainella_elasticsearch
  @log_level info
  include_tag_key true
  host elasticsearch
  port 9200
  path ""
  scheme http
  index_name kainella-logs
  type_name _doc
  <buffer>
    @type file
    path /var/log/fluentd/buffers/kainella
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

<match nginx.**>
  @type elasticsearch
  @id nginx_elasticsearch
  @log_level info
  include_tag_key true
  host elasticsearch
  port 9200
  path ""
  scheme http
  index_name nginx-logs
  type_name _doc
  <buffer>
    @type file
    path /var/log/fluentd/buffers/nginx
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>
